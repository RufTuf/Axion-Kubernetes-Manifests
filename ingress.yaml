apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axion-ui-ingress
  namespace: axion-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: axion-ui.axion-dev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: axion-ui-service
                port:
                  number: 80