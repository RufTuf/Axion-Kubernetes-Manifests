apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-ui
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RufTuf/Axion-Kubernetes-Manifests.git
    targetRevision: main
    path: axion-ui

  destination:
    server: https://kubernetes.default.svc
    namespace: axion-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true