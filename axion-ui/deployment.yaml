apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: axion-ui

  template:
    metadata:
      labels:
        app: axion-ui

    spec:
      containers:
       - name: axion-ui
         image: axionacr1.azurecr.io/axionuigit:567
         ports:
          - containerPort: 80
