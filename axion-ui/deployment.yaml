apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: axion-ui

  template:
    metadata:
      labels:
        app: axion-ui

    spec:
      containers:
       - name: axion-ui
         image: axionacr1.azurecr.io/axionui:539
         ports:
          - containerPort: 80
