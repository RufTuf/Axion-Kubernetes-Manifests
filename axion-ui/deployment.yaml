apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: axion-ui

  template:
    metadata:
      labels:
        app: axion-ui

    spec:
      containers:
        - name: axion-ui
          image: axionacr1.azurecr.io/axionuigit:607
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi